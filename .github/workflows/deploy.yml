name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Change this to 'master' if your default branch uses the old naming

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/configure-pages@v4
        with:
          node-version: 20 # Uses Node 20 to compile the build

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # Vite outputs to the 'dist' folder by default

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4